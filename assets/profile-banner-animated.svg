<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Cristian Barreiro — Full-Stack Developer</title>
  <desc id="desc">Dark technology banner with animated neon blue and violet orbit, terminal, and profile text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset=".55" stop-color="#090d1c"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".52" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182d"/>
      <stop offset="1" stop-color="#21113e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#6557ff" opacity=".55"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <ellipse cx="950" cy="215" rx="390" ry="290" fill="url(#glow)"/>
    <rect x="28" y="28" width="230" height="160" fill="url(#dots)" opacity=".8"/>
    <path d="M0 145 H75 M0 154 H48 M1200 310 H1120 M1200 319 H1164" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
    <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".65">
      <path d="M780 60 H900 L932 28 H1060"/>
      <path d="M830 83 H922 L950 55 H1132"/>
      <path d="M760 340 H870 L900 370 H1050"/>
      <path d="M805 362 H860 L890 392 H1000"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="780" cy="60" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="28" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="340" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(930 210)">
      <circle r="176" fill="none" stroke="#14203c" stroke-width="18"/>
      <circle r="176" fill="none" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" stroke-dasharray="710 395" transform="rotate(-72)" filter="url(#softGlow)">
        <animateTransform attributeName="transform" type="rotate" from="-72" to="288" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="145" fill="none" stroke="#26365e" stroke-width="1" stroke-dasharray="4 12" opacity=".85"/>
    </g>
    <g transform="translate(765 105)">
      <rect width="360" height="172" rx="16" fill="#080d1b" stroke="#29385b" stroke-width="2"/>
      <path d="M0 16 Q0 0 16 0 H344 Q360 0 360 16 V33 H0 Z" fill="#121a30"/>
      <circle cx="20" cy="16" r="5" fill="#fb7185"/>
      <circle cx="39" cy="16" r="5" fill="#facc15"/>
      <circle cx="58" cy="16" r="5" fill="#34d399"/>
      <g font-family="Consolas,monospace" font-size="15">
        <text x="24" y="66" fill="#22d3ee">&gt; cd ~/projects</text>
        <text x="24" y="93" fill="#a78bfa">&gt; build amazing things</text>
        <text x="24" y="120" fill="#22d3ee">&gt; <tspan fill="#ffffff">_</tspan><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/></text>
      </g>
    </g>
    <g transform="translate(1010 47)">
      <circle r="52" fill="#090d19" stroke="url(#neon)" stroke-width="4" filter="url(#softGlow)"/>
      <text x="0" y="13" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">C<tspan fill="#38bdf8">B</tspan></text>
    </g>
    <g font-family="Arial,Helvetica,sans-serif">
      <text x="72" y="160" fill="#f8fafc" font-size="51" font-weight="700" letter-spacing="-1.3">Cristian Barreiro</text>
      <text x="72" y="211" font-size="34" font-weight="600" fill="url(#neon)">{ Full-Stack Developer }</text>
      <rect x="73" y="242" width="42" height="42" rx="9" fill="#0b1328" stroke="url(#neon)" stroke-width="2"/>
      <path d="M85 254 L96 263 L85 272 M100 273 H106" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="132" y="269" fill="#dbe5f5" font-size="20">Building scalable, modern digital solutions.</text>
      <rect x="73" y="306" width="42" height="42" rx="9" fill="#0b1328" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M83 319 H105 V335 H83 Z M83 319 L94 328 L105 319" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linejoin="round"/>
      <text x="132" y="332" fill="#dbe5f5" font-size="17">Software Development · IT Support · Cloud</text>
      <text x="73" y="386" fill="#7789b4" font-size="12" letter-spacing="4">CODE  /  BUILD  /  SOLVE  /  GROW</text>
    </g>
    <path d="M70 40 H172" stroke="url(#neon)" stroke-width="3">
      <animate attributeName="x2" values="112;205;112" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>