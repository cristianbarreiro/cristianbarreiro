<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Profile banner animation preview</title>
  <style>
    body { margin: 0; padding: 20px; background: #080a10; color: #eaf2ff; font: 14px system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; }
    #stage { position: relative; width: 100%; aspect-ratio: 1672 / 941; background: #05070c; }
    #stage > img, #stage > object, #lottie-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    #stage > img { object-fit: contain; }
    #stage > object { border: 0; background: transparent; }
    #lottie-container[hidden] { display: none; }
    #status { margin-top: 10px; color: #9cb4d8; }
  </style>
</head>
<body>
  <main>
    <div id="stage" role="img" aria-label="Profile banner with a moving highlight following the rounded portfolio button border">
      <object id="svg-fallback" data="profile-banner-animated.svg?v=6" type="image/svg+xml" aria-label="Animated profile banner">Animated SVG preview unavailable.</object>
      <div id="lottie-container" hidden></div>
    </div>
    <p id="status">Loading the animated profile banner…</p>
  </main>
  <script>
    const status = document.getElementById('status');
    const fallback = document.getElementById('svg-fallback');
    const lottieContainer = document.getElementById('lottie-container');

    if (location.protocol === 'file:') {
      status.textContent = 'The self-contained animated SVG is showing. Serve the project over HTTP to preview the Lottie JSON.';
    } else {
      const player = document.createElement('script');
      player.src = '../node_modules/lottie-web/build/player/lottie.min.js';
      player.onload = () => {
        const animation = bodymovin.loadAnimation({
          container: lottieContainer,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: 'profile-banner-lottie-source.json',
          rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
        });
        animation.addEventListener('DOMLoaded', () => {
          fallback.hidden = true;
          lottieContainer.hidden = false;
          status.textContent = 'Lottie-Web loaded; the short accent-line sweep, rounded-border highlight, and blinking cursor are active.';
        });
        animation.addEventListener('data_failed', () => {
          status.textContent = 'Lottie JSON failed to load; the animated SVG remains visible.';
        });
      };
      player.onerror = () => {
        status.textContent = 'Lottie-Web could not load; the animated SVG remains visible.';
      };
      document.head.appendChild(player);
    }
  </script>
</body>
</html>
