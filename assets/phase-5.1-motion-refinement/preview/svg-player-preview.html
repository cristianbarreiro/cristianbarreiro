<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phase 5.1 Animated SVG preview</title>
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
      body { margin: 0; padding: 20px; background: #080a10; color: #eaf2ff; }
      main { width: min(100%, 1000px); margin: auto; }
      object { display: block; width: 100%; aspect-ratio: 1672 / 941; background: #05070c; }
      #status { margin-top: 10px; color: #9cb4d8; }
    </style>
  </head>
  <body>
    <main>
      <object id="banner" data="../profile-banner-phase-5.1-animated.svg" type="image/svg+xml" aria-label="Animated profile banner"></object>
      <div id="status" aria-live="polite">Loading the self-contained SVG…</div>
    </main>
    <script>
      const object = document.getElementById('banner');
      const status = document.getElementById('status');
      object.addEventListener('load', () => {
        const svg = object.contentDocument?.documentElement;
        if (!svg || typeof svg.getCurrentTime !== 'function') {
          status.textContent = 'SVG loaded; this browser does not expose SMIL timing.';
          return;
        }
        window.setInterval(() => {
          status.textContent = `Animated SVG loaded; SMIL time ${svg.getCurrentTime().toFixed(2)} s`;
        }, 250);
      });
    </script>
  </body>
</html>
