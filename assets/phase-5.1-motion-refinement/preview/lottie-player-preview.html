<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phase 5.1 Lottie preview</title>
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
      body { margin: 0; padding: 20px; background: #080a10; color: #eaf2ff; }
      main { width: min(100%, 1000px); margin: auto; }
      #banner { width: 100%; aspect-ratio: 1672 / 941; background: #05070c; }
      #status { margin-top: 10px; color: #9cb4d8; }
      button { margin-top: 8px; padding: 7px 12px; color: inherit; background: #171c29; border: 1px solid #39455d; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <div id="banner" role="img" aria-label="Animated profile banner"></div>
      <button id="toggle" type="button">Pause</button>
      <div id="status" aria-live="polite">Loading the 9-second Lottie loop…</div>
    </main>
    <script src="/node_modules/lottie-web/build/player/lottie.min.js"></script>
    <script>
      const status = document.getElementById('status');
      const button = document.getElementById('toggle');
      const animation = bodymovin.loadAnimation({
        container: document.getElementById('banner'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: '../profile-banner-phase-5.1.json',
        rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
      });
      animation.addEventListener('DOMLoaded', () => {
        const imageCount = document.querySelectorAll('#banner svg image').length;
        status.textContent = `Lottie-Web SVG renderer loaded; ${imageCount} embedded image nodes; frame ${animation.currentFrame.toFixed(1)}`;
        window.setInterval(() => {
          status.textContent = `Lottie-Web SVG renderer loaded; ${imageCount} embedded image nodes; frame ${animation.currentFrame.toFixed(1)}`;
        }, 250);
      });
      animation.addEventListener('data_failed', () => { status.textContent = 'Lottie JSON failed to load'; });
      button.addEventListener('click', () => {
        if (animation.isPaused) { animation.play(); button.textContent = 'Pause'; }
        else { animation.pause(); button.textContent = 'Play'; }
      });
    </script>
  </body>
</html>
