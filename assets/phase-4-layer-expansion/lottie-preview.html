<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phase 4 banner — Lottie preview</title>
    <style>
      :root { color-scheme: dark; background: #080b14; color: #e8efff; font: 14px system-ui, sans-serif; }
      body { margin: 0; padding: 24px; }
      main { max-width: 1200px; margin: 0 auto; }
      #banner { width: 100%; aspect-ratio: 1672 / 941; }
      #status { color: #aebad3; }
    </style>
  </head>
  <body>
    <main>
      <p id="status" role="status">Loading Phase 4 Lottie animation…</p>
      <div id="banner" aria-label="Animated profile banner"></div>
    </main>
    <script src="/node_modules/lottie-web/build/player/lottie.js"></script>
    <script>
      const status = document.querySelector('#status');
      const animation = bodymovin.loadAnimation({
        container: document.querySelector('#banner'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: './profile-banner-phase-4.json',
        rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
      });
      animation.addEventListener('DOMLoaded', () => {
        status.textContent = `Lottie loaded · ${animation.totalFrames} frames · ${animation.frameRate} fps`;
      });
      animation.addEventListener('data_failed', () => {
        status.textContent = 'Lottie could not load its animation data or image assets.';
      });
    </script>
  </body>
</html>
