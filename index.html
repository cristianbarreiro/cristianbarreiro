<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <meta name="description" content="A small Lottie web integration example for Cristian Barreiro's profile project." />
    <title>Lottie Web — Cristian Barreiro</title>
  </head>
  <body>
    <main class="page-shell">
      <section class="showcase" aria-labelledby="page-title">
        <div class="copy">
          <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> LOTTIE WEB READY</p>
          <h1 id="page-title">Motion, made for the web.</h1>
          <p class="intro">A lightweight local demo showing <code>lottie-web</code> rendering a JSON animation as SVG.</p>
          <div class="actions" aria-label="Animation controls">
            <button id="toggle-animation" class="button button-primary" type="button" aria-pressed="false">Pause animation</button>
            <button id="restart-animation" class="button button-secondary" type="button">Restart</button>
          </div>
          <p id="animation-status" class="status" role="status" aria-live="polite">Loading animation…</p>
        </div>

        <div class="visual" aria-label="Animated orbit of technology symbols">
          <div class="visual-glow" aria-hidden="true"></div>
          <div id="lottie-animation" class="animation" aria-hidden="true"></div>
          <span class="visual-caption">BUILT WITH LOTTIE-WEB</span>
        </div>
      </section>
      <footer>Local JSON · SVG renderer · Reduced-motion aware</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
